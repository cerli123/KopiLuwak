<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A0E07">
  <title>Tidak ada koneksi — Kopiluwak</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#1A0E07;color:#F0E0CC;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
    .box{max-width:340px}
    .ico{width:88px;height:88px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:rgba(217,165,102,.14);font-size:40px}
    h1{font-size:22px;color:#E2B889;margin-bottom:10px}
    p{font-size:15px;line-height:1.6;color:rgba(255,255,255,.7);margin-bottom:26px}
    button{width:100%;padding:14px;border:0;border-radius:14px;background:#D9A566;color:#1A0E07;font-size:16px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <div class="ico">☕</div>
    <h1>Tidak ada koneksi</h1>
    <p>Sepertinya internet Anda sedang bermasalah. Periksa sinyal atau Wi-Fi, lalu coba lagi.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
