---
# Dijalankan cPanel saat klik "Deploy HEAD Commit" (Git Version Control).
# GANTI "CPUSER" dengan username cPanel Anda (di semua baris).
# Jika "composer" tidak dikenali: ganti dengan /opt/cpanel/composer/bin/composer
deployment:
  tasks:
    - cd /home/smkwikr3/kopiluwak-app && composer install --no-dev --optimize-autoloader --no-interaction
    - cd /home/smkwikr3/kopiluwak-app && php artisan migrate --force
    - cd /home/smkwikr3/kopiluwak-app && php artisan config:clear
    - cd /home/smkwikr3/kopiluwak-app && php artisan route:clear
    - cd /home/smkwikr3/kopiluwak-app && php artisan view:clear
    - cd /home/smkwikr3/kopiluwak-app && php artisan config:cache
    - cd /home/smkwikr3/kopiluwak-app && php artisan route:cache
